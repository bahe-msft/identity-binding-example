apiVersion: v1
kind: Namespace
metadata:
  name: demo-app-delegation-java
  labels:
    name: demo-app-delegation-java
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: demo-app-delegation-java-sa
  namespace: demo-app-delegation-java
  labels:
    app: demo-app-delegation-java
  annotations:
    azure.workload.identity/client-id: "<app-MI-client-id>"
---
# ClusterRole for Identity Binding - allows using both managed identities
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: demo-identity-binding-role
rules:
  - verbs: ["use-managed-identity"]
    apiGroups: ["cid.wi.aks.azure.com"]
    resources: ["<app-MI-id>"]
---
# ClusterRoleBinding to bind the role to the service account
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: demo-identity-binding-role-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: demo-identity-binding-role
subjects:
  - kind: ServiceAccount
    name: demo-app-delegation-java-sa
    namespace: demo-app-delegation-java
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app-delegation-java
  namespace: demo-app-delegation-java
  labels:
    app: demo-app-delegation-java
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-app-delegation-java
  template:
    metadata:
      labels:
        app: demo-app-delegation-java
        azure.workload.identity/use: "true"
      annotations:
        azure.workload.identity/use-identity-binding: "true"
        azure.workload.identity/inject-proxy-sidecar: "true" # Enable migration sidecar
        azure.workload.identity/proxy-sidecar-port: "8000" # Set sidecar port (default is 8000)
        azure.workload.identity/skip-containers: "demo-app-delegation-java" # Skip injection in main container as Java SDK has a special logic around AZURE_FEDERATED_TOKEN_FILE
    spec:
      serviceAccountName: demo-app-delegation-java-sa
      containers:
        - name: demo-app-delegation-java
          image: ghcr.io/bahe-msft/identity-binding-example-java@sha256:3381717bf100b1315eb6a3bef0abd5b01bbb48d91fbe2d37dba9f1b4a9a2c3ac
          imagePullPolicy: Always
          env:
            - name: AZURE_HTTP_LOG_DETAIL_LEVEL
              value: BODY_AND_HEADERS
            - name: KEYVAULT_URL
              value: "https://<your-keyvault-name>.vault.azure.net/"
            - name: SECRET_NAME
              value: "demo-secret"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SERVICE_ACCOUNT
              valueFrom:
                fieldRef:
                  fieldPath: spec.serviceAccountName
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "200m"
